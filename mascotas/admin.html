<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel municipal | QR Mascotas</title><style>body{font:16px system-ui;background:#f5f3fb;color:#272038;margin:0}.wrap{max-width:850px;margin:25px auto;padding:16px}.card{background:white;border-radius:18px;padding:24px;margin-bottom:18px}h1{color:#6534a4}label{display:block;margin:12px 0 5px;font-weight:600}input,select,button{font:inherit;width:100%;padding:11px;border:1px solid #c9c1d8;border-radius:9px;box-sizing:border-box}button{background:#6534a4;color:white;cursor:pointer;margin-top:15px}.hidden{display:none}.item{border-top:1px solid #ddd;padding:12px 0}.muted{color:#686175}a{color:#6534a4}</style></head><body><main class="wrap"><div class="card"><a href="./">← QR Mascotas</a><h1>Panel municipal</h1><p>Solo operadores autorizados pueden cargar y editar registros.</p><div id="login"><label>Correo</label><input id="email" type="email"><label>Contraseña</label><input id="password" type="password"><button id="enter">Ingresar</button></div><div id="app" class="hidden"><button id="exit">Cerrar sesión</button><h2>Registrar perro</h2><form id="form"><label>Nombre del perro</label><input id="nombre" maxlength="100" required><label>Fotografía actual (JPG, PNG o WebP, máximo 2 MB)</label><input id="foto" type="file" accept="image/jpeg,image/png,image/webp"><label>Nombre del responsable (uso interno)</label><input id="responsable" maxlength="120"><label><input id="consent" type="checkbox" style="width:auto"> Autorizó publicar el nombre del responsable</label><label>Vacuna antirrábica</label><select id="vacuna"><option value="sin_datos">Sin información</option><option value="vigente">Vigente</option><option value="vencida">Vencida</option></select><label>Castración</label><select id="castrado"><option value="sin_datos">Sin información</option><option value="si">Sí</option><option value="no">No</option></select><label>Situación</label><select id="situacion"><option value="sin_datos">Sin información</option><option value="con_dueno">Con responsable</option><option value="sin_responsable">Sin responsable identificado</option><option value="extraviado">Extraviado</option></select><label>Fecha del relevamiento</label><input id="fecha" type="date" required><button id="save" type="submit">Guardar ficha</button></form><h2>Registros</h2><div id="list"></div></div><p id="msg" role="status"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://srottoudvavudcujvzeb.supabase.co','sb_publishable_wpYSqgBPatf4EZa2AsKLpA_He28PET4'),$=id=>document.getElementById(id);let operator=false;
$('fecha').value=new Date().toISOString().slice(0,10);
function msg(s){$('msg').textContent=s}
async function check(){const {data:{user}}=await db.auth.getUser();if(!user){operator=false;$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const {data,error}=await db.from('mascotas_operadores').select('user_id').eq('user_id',user.id).maybeSingle();operator=!!data&&!error;$('login').classList.toggle('hidden',operator);$('app').classList.toggle('hidden',!operator);if(!operator)msg('La cuenta no está habilitada como operador municipal.');else{msg('');list()}}
$('enter').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg(error.message);else check()};
$('exit').onclick=async()=>{await db.auth.signOut();check()};
$('form').onsubmit=async e=>{e.preventDefault();if(!operator)return;const b=$('save');b.disabled=true;try{const file=$('foto').files[0];if(file&&(file.size>2097152||!['image/jpeg','image/png','image/webp'].includes(file.type)))throw Error('La foto debe ser JPG, PNG o WebP y pesar menos de 2 MB');const id=crypto.randomUUID();let foto_url=null;if(file){const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type];const path=id+'.'+ext;const upload=await db.storage.from('mascotas-fotos').upload(path,file,{contentType:file.type,upsert:false});if(upload.error)throw upload.error;foto_url=db.storage.from('mascotas-fotos').getPublicUrl(path).data.publicUrl}
const owner=$('responsable').value.trim();const {error}=await db.from('mascotas_registro').insert({id,nombre:$('nombre').value.trim(),responsable_publico:owner&&$('consent').checked?owner:null,mostrar_responsable:!!(owner&&$('consent').checked),vacuna_antirrabica:$('vacuna').value,castrado:$('castrado').value,situacion:$('situacion').value,fecha_relevamiento:$('fecha').value,foto_url});if(error)throw error;if(owner){const r=await db.from('mascotas_responsables').insert({mascota_id:id,nombre:owner});if(r.error)throw r.error}msg('Ficha creada. URL permanente: '+new URL('./?id='+id,location.href).href);$('form').reset();$('fecha').value=new Date().toISOString().slice(0,10);list()}catch(err){msg('Error: '+err.message)}finally{b.disabled=false}};
async function list(){const {data,error}=await db.from('mascotas_registro').select('id,nombre,fecha_relevamiento').order('creado_en',{ascending:false}).limit(100);if(error){msg(error.message);return}const container=$('list');container.replaceChildren();for(const d of data){const row=document.createElement('div');row.className='item';const a=document.createElement('a');a.href='./?id='+encodeURIComponent(d.id);a.textContent=d.nombre+' · '+d.fecha_relevamiento;a.target='_blank';row.append(a);container.append(row)}}
check();
</script></body></html>
