<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta especial | QRcrea</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .specialCard {
      width: 100%;
      max-width: 480px;
      min-height: 620px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.14);
      overflow: hidden;
      position: relative;
      text-align: center;
      padding: 38px 28px 26px;
      background-size: cover;
      background-position: center;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.78);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .occasionIcon {
      font-size: 52px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 34px;
      line-height: 1.15;
      color: #1f2937;
    }

    .message {
      font-size: 18px;
      line-height: 1.6;
      color: #374151;
      white-space: pre-line;
      margin: 0 auto 24px;
    }

.mainImage {
  display: none;
  width: 100%;
  height: auto;
  max-height: 420px;
  object-fit: contain;
  border-radius: 20px;
  margin: 0 auto 24px;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
}

    .specialButton {
      display: none;
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      margin-top: 18px;
    }

    .musicBox {
      display: none;
      margin-top: 22px;
    }

    audio {
      width: 100%;
    }

    .brand {
      position: relative;
      z-index: 1;
      margin-top: 30px;
      font-size: 12px;
      color: #64748b;
    }

    /* Cumpleaños */
    .birthday {
      background-color: #fff7ed;
    }

    /* Navidad */
    .christmas {
      background-color: #f0fdf4;
    }

    /* Invitación */
    .invitation {
      background-color: #fdf4ff;
    }

    /* Personalizada */
    .custom {
      background-color: #f5f3ff;
    }
    .effectsLayer {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 10;
}

.confetti {
  position: absolute;
  top: -20px;
  width: 9px;
  height: 15px;
  border-radius: 3px;
  opacity: 0.8;
  animation: confettiFall linear forwards;
}
.snowflake {
  position: absolute;
  top: -30px;
  color: #62BDE8;
  font-size: 20px;
  opacity: 0.85;
  text-shadow: 0 1px 4px rgba(30, 120, 180, 0.35);
  animation: snowFall linear forwards;
}

@keyframes snowFall {
  0% {
    transform: translateY(-30px) translateX(0) rotate(0deg);
  }

  50% {
    transform: translateY(55vh) translateX(25px) rotate(180deg);
  }

  100% {
    transform: translateY(110vh) translateX(-20px) rotate(360deg);
  }
}

/* Aspecto especial de Navidad */
.specialCard.christmas {
  background-color: #f0fdf4;
}

.specialCard.christmas h1 {
  text-shadow: 0 2px 8px rgba(255,255,255,0.9);
}

.specialCard.christmas .overlay {
  background: rgba(255,255,255,0.72);
}

@keyframes confettiFall {
  0% {
    transform: translateY(-20px) rotate(0deg);
  }

  100% {
    transform: translateY(110vh) rotate(720deg);
  }
}
/* =========================
   ESTILO INVITACIÓN
========================= */

.specialCard.invitation {
  background: linear-gradient(
    145deg,
    #fffafd 0%,
    #f7f2ff 50%,
    #fffaf5 100%
  );

  border: 1px solid rgba(99, 91, 255, 0.18);
}

.specialCard.invitation::after {
  content: "";
  position: absolute;
  inset: 14px;
  border: 1px solid rgba(99, 91, 255, 0.22);
  border-radius: 20px;
  pointer-events: none;
  z-index: 1;
}

.specialCard.invitation .content {
  position: relative;
  z-index: 2;
}

.specialCard.invitation .brand {
  position: relative;
  z-index: 2;
}

.specialCard.invitation .occasionIcon {
  font-size: 46px;
  margin-bottom: 16px;
}

.specialCard.invitation h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.specialCard.invitation .message {
  font-family: Georgia, "Times New Roman", serif;
  line-height: 1.8;
}

.specialCard.invitation .mainImage {
  border-radius: 14px;
}

.specialCard.invitation .specialButton {
  border-radius: 30px;
  letter-spacing: 0.4px;
}
/* Brillos de invitación */

.lightParticle {
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.95);

  box-shadow:
    0 0 6px rgba(255,255,255,1),
    0 0 14px rgba(255,210,235,.9),
    0 0 24px rgba(190,175,255,.7);

  pointer-events: none;

  animation: lightFloat ease-in-out infinite;
}

@keyframes lightFloat {

  0% {
    opacity: 0;
    transform: translateY(20px) scale(.4);
  }

  30% {
    opacity: .9;
  }

  60% {
    opacity: .6;
    transform: translateY(-25px) scale(1.2);
  }

  100% {
    opacity: 0;
    transform: translateY(-55px) scale(.3);
  }
}
/* =========================
   TARJETA PERSONALIZADA
========================= */

.specialCard.custom {
  border: 2px solid var(--custom-color, #635bff);

  box-shadow:
    0 18px 50px rgba(0,0,0,.12),
    0 0 22px var(--custom-glow, rgba(99,91,255,.20));
}

.specialCard.custom::after {
  content: "";
  position: absolute;
  inset: 12px;
  border: 1px solid var(--custom-color, #635bff);
  border-radius: 20px;
  opacity: .25;
  pointer-events: none;
  z-index: 1;
}

.specialCard.custom .content,
.specialCard.custom .brand {
  position: relative;
  z-index: 2;
}

    @media (max-width: 520px) {
      body {
        padding: 0;
        align-items: stretch;
      }

      .specialCard {
        max-width: none;
        min-height: 100vh;
        border-radius: 0;
        padding: 34px 22px 24px;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>
    <div id="effectsLayer" class="effectsLayer"></div>

  <main class="specialCard" id="specialCard">

    <div class="overlay"></div>

    <div class="content">

      <div class="occasionIcon" id="occasionIcon">✨</div>

      <h1 id="specialTitle"></h1>

      <img
        id="specialImage"
        class="mainImage"
        alt="Imagen de la tarjeta"
      >

      <p id="specialMessage" class="message"></p>

      <a
        id="specialButton"
        class="specialButton"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      ></a>

      <div id="musicBox" class="musicBox">
        <audio id="specialMusic" controls></audio>
      </div>
      <button
  id="downloadCardVideo"
  type="button"
  style="
    display: none;
    width: 100%;
    margin-top: 18px;
    padding: 15px;
    background: #635bff;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  "
>
  🎬 Descargar tarjeta con música
</button>

    </div>

    <div class="brand">
      Creado con QRcrea
    </div>

  </main>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const slug = params.get("slug");
function iniciarConfeti() {

  const layer = document.getElementById("effectsLayer");

  const colores = [
    "#635bff",
    "#ff4d8d",
    "#ffd54a",
    "#36cfc9",
    "#ff8a3d"
  ];

  for (let i = 0; i < 45; i++) {

    const confetti = document.createElement("span");
    confetti.className = "confetti";

    confetti.style.left =
      Math.random() * 100 + "vw";

    confetti.style.backgroundColor =
      colores[Math.floor(Math.random() * colores.length)];

    confetti.style.animationDuration =
      (3 + Math.random() * 4) + "s";

    confetti.style.animationDelay =
      (Math.random() * 3) + "s";

    layer.appendChild(confetti);

    setTimeout(() => {
      confetti.remove();
    }, 8000);
  }
}
function iniciarNieve() {

  const layer = document.getElementById("effectsLayer");

  for (let i = 0; i < 40; i++) {

    const snow = document.createElement("span");
    snow.className = "snowflake";
    snow.textContent = "❄";

    snow.style.left =
      Math.random() * 100 + "vw";

    snow.style.fontSize =
      (10 + Math.random() * 18) + "px";

    snow.style.opacity =
      0.35 + Math.random() * 0.55;

    snow.style.animationDuration =
      (5 + Math.random() * 5) + "s";

    snow.style.animationDelay =
      (Math.random() * 4) + "s";

    layer.appendChild(snow);

    setTimeout(() => {
      snow.remove();
    }, 11000);
  }
}
function iniciarParticulasLuz() {

  const layer = document.getElementById("effectsLayer");

  for (let i = 0; i < 30; i++) {

    const particle = document.createElement("span");

    particle.className = "lightParticle";

    particle.style.left =
      (5 + Math.random() * 90) + "vw";

    particle.style.top =
      (10 + Math.random() * 80) + "vh";

    const size = 3 + Math.random() * 6;

    particle.style.width = size + "px";
    particle.style.height = size + "px";

    particle.style.animationDuration =
      (3 + Math.random() * 4) + "s";

    particle.style.animationDelay =
      (Math.random() * 5) + "s";

    layer.appendChild(particle);
  }
}


async function cargarTarjetaEspecial() {

  if (!slug) return;

  try {

    const response = await fetch(
      `https://srottoudvavudcujvzeb.supabase.co/functions/v1/resolve-qr?slug=${encodeURIComponent(slug)}`
    );

    if (!response.ok) {
      console.error("No se pudo cargar la tarjeta.");
      return;
    }

    const data = await response.json();

    const card = document.getElementById("specialCard");
    const icon = document.getElementById("occasionIcon");

    const template = data.template || "custom";

    card.classList.add(template);
    if (template === "birthday") {
 iniciarConfeti();
}
if (template === "christmas") {
  iniciarNieve();
}
if (template === "invitation") {
  iniciarParticulasLuz();
}

    // ICONO SEGÚN TIPO

    const icons = {
      birthday: "🎂",
      christmas: "🎄",
      invitation: "💌",
      custom: "✨"
    };

    icon.textContent = icons[template] || "✨";


    // TÍTULO

    document.getElementById("specialTitle").textContent =
      data.title || "";


    // MENSAJE

    const message =
      document.getElementById("specialMessage");

    if (data.message) {
      message.textContent = data.message;
    } else {
      message.style.display = "none";
    }


    // COLOR PRINCIPAL

    const color = data.color || "#635bff";

    document.getElementById("specialTitle").style.color =
      color;
      if (template === "custom") {
  card.style.setProperty("--custom-color", color);
  card.style.setProperty("--custom-glow", color + "40");
}


    // IMAGEN PRINCIPAL

    const image =
      document.getElementById("specialImage");

    if (data.image_url) {
      image.src = data.image_url;
      image.style.display = "block";
    }


    // FONDO

    if (data.background_url) {
      card.style.backgroundImage =
        `url("${data.background_url}")`;
    }


    // BOTÓN

    const button =
      document.getElementById("specialButton");

    if (data.button_text && data.button_url) {

      button.textContent = data.button_text;
      button.href = data.button_url;
      button.style.backgroundColor = color;
      button.style.display = "block";
    }


    // MÚSICA

    const music =
      document.getElementById("specialMusic");

    const musicBox =
      document.getElementById("musicBox");

   if (data.music_url) {
  music.src = data.music_url;
  musicBox.style.display = "block";

  document.getElementById("downloadCardVideo").style.display = "block";
}

  }

  catch (error) {
    console.error(
      "Error cargando la tarjeta especial:",
      error
    );
  }
}
document.getElementById("downloadCardVideo")
  .addEventListener("click", descargarTarjetaVideo);

async function descargarTarjetaVideo() {
  const boton = document.getElementById("downloadCardVideo");
  const tarjeta = document.getElementById("specialCard");
  const musica = document.getElementById("specialMusic");

  boton.disabled = true;
  boton.textContent = "🎬 Preparando video...";

  let contextoAudio;
  let stream;
  let grabador;

  try {
    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
      throw new Error("Este navegador no permite grabar videos.");
    }

    // Capturar tarjeta sin reproductor ni botón
    const captura = await html2canvas(tarjeta, {
      backgroundColor: "#ffffff",
      scale: 2,
      useCORS: true,
      ignoreElements: elemento =>
        elemento.id === "musicBox" ||
        elemento.id === "downloadCardVideo"
    });

    const canvas = document.createElement("canvas");
    canvas.width = 1080;
    canvas.height = 1920;

    const ctx = canvas.getContext("2d");

    // Preparar confeti animado
    const colores = [
      "#ff4d8d",
      "#635bff",
      "#ffd54a",
      "#36cfc9",
      "#ff8a3d"
    ];

    const confetis = Array.from({ length: 65 }, () => ({
      x: Math.random() * 1080,
      y: Math.random() * 1920,
      velocidad: 1 + Math.random() * 3,
      tamaño: 5 + Math.random() * 9,
      color: colores[Math.floor(Math.random() * colores.length)]
    }));

    // Preparar audio
    contextoAudio = new AudioContext();

    

   const fuente = contextoAudio.createMediaElementSource(musica);
const destino = contextoAudio.createMediaStreamDestination();

    fuente.connect(destino);
    fuente.connect(contextoAudio.destination);

    await contextoAudio.resume();

    // Preparar video
    stream = canvas.captureStream(30);

    destino.stream.getAudioTracks().forEach(track => {
      stream.addTrack(track);
    });

    const formato = [
      "video/webm;codecs=vp8,opus",
      "video/webm"
    ].find(tipo => MediaRecorder.isTypeSupported(tipo));

    if (!formato) {
      throw new Error("El navegador no admite grabación WebM.");
    }

    grabador = new MediaRecorder(stream, {
      mimeType: formato
    });

    const fragmentos = [];

    grabador.ondataavailable = evento => {
      if (evento.data.size > 0) {
        fragmentos.push(evento.data);
      }
    };

    // Dibujar cada fotograma
    let animando = true;

    function dibujar() {
      if (!animando) return;

      ctx.clearRect(0, 0, 1080, 1920);

      // Fondo blanco
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 1080, 1920);

      // Tarjeta manteniendo proporciones
      const escala = Math.min(
        1080 / captura.width,
        1920 / captura.height
      );

      const ancho = captura.width * escala;
      const alto = captura.height * escala;

      ctx.drawImage(
        captura,
        (1080 - ancho) / 2,
        (1920 - alto) / 2,
        ancho,
        alto
      );

      // Confeti animado
      confetis.forEach(c => {
        ctx.fillStyle = c.color;
        ctx.fillRect(c.x, c.y, c.tamaño, c.tamaño * 1.6);

        c.y += c.velocidad * 2;

        if (c.y > 1920) {
          c.y = -20;
          c.x = Math.random() * 1080;
        }
      });

      requestAnimationFrame(dibujar);
    }

    dibujar();

    boton.textContent = "🎬 Grabando tarjeta...";

    musica.pause();
    musica.currentTime = 0;

    // Esperar que la música tenga duración conocida
    if (!Number.isFinite(musica.duration)) {
      await new Promise((resolve, reject) => {
        musica.addEventListener("loadedmetadata", resolve, { once: true });
        musica.addEventListener("error", reject, { once: true });
      });
    }

    const duracion = musica.duration;

    if (!Number.isFinite(duracion) || duracion <= 0) {
      throw new Error("No se pudo determinar la duración de la música.");
    }

    // Grabar hasta que termine la canción
    const finalizacion = new Promise((resolve, reject) => {
      grabador.onstop = resolve;
      grabador.onerror = reject;
    });

    grabador.start(1000);
    await musica.play();

    await new Promise(resolve => {
      const verificar = setInterval(() => {
        if (
          musica.ended ||
          musica.currentTime >= duracion - 0.1
        ) {
          clearInterval(verificar);
          resolve();
        }
      }, 200);
    });

    animando = false;
    grabador.stop();

    await finalizacion;

    const archivo = new Blob(fragmentos, {
      type: formato
    });

    const url = URL.createObjectURL(archivo);

    const enlace = document.createElement("a");
    enlace.href = url;
    enlace.download = "tarjeta-qrcrea.webm";

    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();

    setTimeout(() => URL.revokeObjectURL(url), 5000);

    alert("¡Video descargado correctamente!");

  } catch (error) {
    console.error("Error generando video:", error);
    alert("No se pudo generar el video: " + error.message);

  } finally {
    boton.disabled = false;
    boton.textContent = "🎬 Descargar tarjeta con música";
  }
}
cargarTarjetaEspecial();


</script>

</body>
</html>
