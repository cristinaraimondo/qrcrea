<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de presentación | QRcrea</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f3ff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .vcard {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
      text-align: center;
      position: relative;
overflow: hidden;
    }

.vcard::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.55);
  z-index: 0;
  pointer-events: none;
}

.vcard > * {
  position: relative;
  z-index: 1;
}
    .vcard #cardPhoto {
  display: none;
  width: 110px !important;
  height: 110px !important;
  max-width: 110px !important;
  max-height: 110px !important;
  object-fit: cover;
  border-radius: 50% !important;
  margin: 0 auto 14px auto;
  object-position: center;
}

   .vcard h1 {
  margin: 8px 0 6px;
  font-size: 28px;
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.5px;
  color: #1f2937;
   text-shadow:
    0 1px 2px rgba(255, 255, 255, 0.95),
    0 0 8px rgba(255, 255, 255, 0.85);
}

   .vcard .company {
  margin: 0 0 14px;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.4;
  color: #4b5563;
  letter-spacing: 0.2px;
  text-shadow:
  0 1px 2px rgba(255, 255, 255, 0.95),
  0 0 6px rgba(255, 255, 255, 0.9);
}
    .vcard a {
      display: block;
      margin: 12px 0;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      background: #635bff;
      color: white;
      font-weight: 600;
    }

    .brand {
      margin-top: 24px;
      font-size: 13px;
      color: #999;
    }
.cardDescription {
  margin: 0 auto 22px;
  max-width: 340px;
  color: #374151;
  line-height: 1.5;
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.1px;
  text-shadow:
  0 1px 2px rgba(255, 255, 255, 0.95),
  0 0 6px rgba(255, 255, 255, 0.9);
}
.vcard .socialLinks {
  display: flex !important;
  flex-direction: row !important;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin: 22px 0 10px;
  width: 100%;
}
.vcard .socialLinks a {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  min-width: 46px;
  padding: 0;
  margin: 0;
  border-radius: 50%;
  text-decoration: none;
  color: white;
  box-sizing: border-box;
}

.vcard .socialLinks a svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}
.vcard .socialLinks a svg {
  width: 23px;
  height: 23px;
  fill: currentColor;
}
  </style>
</head>

<body>

  <div class="vcard">
    <img id="cardPhoto" class="cardPhoto" alt="Foto de perfil">
   <h1 id="cardName">Nombre y apellido</h1>

<div class="company" id="cardCompany">
  Empresa o profesión
</div>
<p id="cardDescription" class="cardDescription"></p>
<a id="cardPhone" href="#">📞 Teléfono</a>
<a id="cardWhatsapp" href="#" target="_blank">💬 WhatsApp</a>
<a id="cardEmail" href="#">✉️ Correo electrónico</a>
<a id="cardWebsite" href="#">🌐 Sitio web</a>
<div class="socialLinks">

  <a id="cardInstagram" href="#" target="_blank" title="Instagram" aria-label="Instagram">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.5-3.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/>
    </svg>
  </a>

  <a id="cardFacebook" href="#" target="_blank" title="Facebook" aria-label="Facebook">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M13.5 22v-9h3l.5-3h-3.5V8.2c0-.9.3-1.7 1.8-1.7H17V3.8c-.7-.1-1.5-.2-2.2-.2-2.7 0-4.5 1.6-4.5 4.6V10H7.5v3h2.8v9h3.2z"/>
  </svg>
</a>
  <a id="cardLinkedin" href="#" target="_blank" title="LinkedIn" aria-label="LinkedIn">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M5.3 7.8H2.1V22h3.2V7.8zM3.7 2A1.9 1.9 0 1 0 3.7 5.8 1.9 1.9 0 0 0 3.7 2zM22 13.8c0-4.3-2.3-6.3-5.4-6.3-2.5 0-3.6 1.4-4.2 2.3v-2H9.2V22h3.2v-7c0-1.8.3-3.6 2.6-3.6 2.2 0 2.3 2.1 2.3 3.7V22H22v-8.2z"/>
  </svg>
</a>
  <a id="cardTiktok" href="#" target="_blank" title="TikTok" aria-label="TikTok">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M16.6 5.8c-1.1-.7-1.9-1.8-2.1-3.1h-3.1v12.5c0 1.6-1.3 2.9-2.9 2.9s-2.9-1.3-2.9-2.9 1.3-2.9 2.9-2.9c.3 0 .6 0 .9.1V9.2c-.3 0-.6-.1-.9-.1-3.4 0-6.1 2.7-6.1 6.1s2.7 6.1 6.1 6.1 6.1-2.7 6.1-6.1V9.1c1.3.9 2.9 1.4 4.6 1.4V7.3c-1 0-1.9-.3-2.6-.8z"/>
  </svg>
</a>

</div>

    <div class="brand">
      Creado con QRcrea
    </div>
  </div>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");

  async function cargarTarjeta() {
    if (!slug) return;

    const response = await fetch(
      `https://srottoudvavudcujvzeb.supabase.co/functions/v1/resolve-qr?slug=${encodeURIComponent(slug)}`
    );

    if (!response.ok) {
      console.error("No se pudo cargar la tarjeta.");
      return;
    }

    const data = await response.json();
    if (data.photo_url) {
  const photo = document.getElementById("cardPhoto");
  photo.src = data.photo_url;
  photo.style.display = "block";
}
if (data.background_url) {
  const card = document.querySelector(".vcard");

  card.style.backgroundImage = `url("${data.background_url}")`;
  card.style.backgroundSize = "cover";
  card.style.backgroundPosition = "center";
  card.style.backgroundRepeat = "no-repeat";
}
    if (data.color) {
  document.querySelectorAll(".vcard a").forEach(button => {
    button.style.background = data.color;
  });
}

    document.getElementById("cardName").textContent =
      data.name || "";

    document.getElementById("cardCompany").textContent =
      data.company || "";
      const description = document.getElementById("cardDescription");

if (data.description) {
  description.textContent = data.description;
  description.style.display = "block";
} else {
  description.style.display = "none";
}

    const phone = document.getElementById("cardPhone");
    phone.textContent = "📞 " + (data.phone || "");
    phone.href = `tel:${data.phone || ""}`;
    const whatsapp = document.getElementById("cardWhatsapp");

if (data.whatsapp) {
  const numeroWhatsapp = data.whatsapp.replace(/\D/g, "");

  whatsapp.textContent = "💬 WhatsApp";
  whatsapp.href = `https://wa.me/${numeroWhatsapp}`;
  whatsapp.style.display = "block";
} else {
  whatsapp.style.display = "none";
}

    const email = document.getElementById("cardEmail");
    email.textContent = "✉️ " + (data.email || "");
    email.href = `mailto:${data.email || ""}`;

    const website = document.getElementById("cardWebsite");
    website.textContent = "🌐 " + (data.website || "");
    website.href = data.website || "#";

    const instagram = document.getElementById("cardInstagram");
if (data.instagram) {
  instagram.href = data.instagram;
  instagram.style.display = "block";
} else {
  instagram.style.display = "none";
}

const facebook = document.getElementById("cardFacebook");
if (data.facebook) {
  facebook.href = data.facebook;
  facebook.style.display = "block";
} else {
  facebook.style.display = "none";
}
const tiktok = document.getElementById("cardTiktok");
if (data.tiktok) {
  tiktok.href = data.tiktok;
  tiktok.style.display = "block";
} else {
  tiktok.style.display = "none";
}

const linkedin = document.getElementById("cardLinkedin");
if (data.linkedin) {
  linkedin.href = data.linkedin;
  linkedin.style.display = "block";
} else {
  linkedin.style.display = "none";
}
  }

  cargarTarjeta();
</script>

</body>
</html>
