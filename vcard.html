<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de presentación | QRcrea</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f3ff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .vcard {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .vcard h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .vcard .company {
      color: #666;
      margin-bottom: 28px;
    }

    .vcard a {
      display: block;
      margin: 12px 0;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      background: #635bff;
      color: white;
      font-weight: 600;
    }

    .brand {
      margin-top: 24px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="vcard">
    <h1>Nombre y apellido</h1>

    <div class="company">
      Empresa o profesión
    </div>

    <a href="#">📞 Teléfono</a>
    <a href="#">✉️ Correo electrónico</a>
    <a href="#">🌐 Sitio web</a>

    <div class="brand">
      Creado con QRcrea
    </div>
  </div>

</body>
</html>
