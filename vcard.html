<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de presentación | QRcrea</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f3ff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .vcard {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
      text-align: center;
      position: relative;
overflow: hidden;
    }

.vcard::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.55);
  z-index: 0;
  pointer-events: none;
}

.vcard > * {
  position: relative;
  z-index: 1;
}
    .vcard #cardPhoto {
  display: none;
  width: 110px !important;
  height: 110px !important;
  max-width: 110px !important;
  max-height: 110px !important;
  object-fit: cover;
  border-radius: 50% !important;
  margin: 0 auto 20px auto;
  object-position: center;
}

    .vcard h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .vcard .company {
      color: #666;
      margin-bottom: 28px;
    }

    .vcard a {
      display: block;
      margin: 12px 0;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      background: #635bff;
      color: white;
      font-weight: 600;
    }

    .brand {
      margin-top: 24px;
      font-size: 13px;
      color: #999;
    }
    .cardDescription {
  margin: 0 0 24px;
  color: #666;
  line-height: 1.5;
  font-size: 15px;
}
.vcard .socialLinks a {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 46px;
  height: 46px;

  padding: 0;
  margin: 0;

  border-radius: 50%;
  text-decoration: none;

  font-size: 16px;
  font-weight: 700;
}
  </style>
</head>

<body>

  <div class="vcard">
    <img id="cardPhoto" class="cardPhoto" alt="Foto de perfil">
   <h1 id="cardName">Nombre y apellido</h1>

<div class="company" id="cardCompany">
  Empresa o profesión
</div>
<p id="cardDescription" class="cardDescription"></p>
<a id="cardPhone" href="#">📞 Teléfono</a>
<a id="cardWhatsapp" href="#" target="_blank">💬 WhatsApp</a>
<a id="cardEmail" href="#">✉️ Correo electrónico</a>
<a id="cardWebsite" href="#">🌐 Sitio web</a>
<div class="socialLinks">
  <a id="cardInstagram" href="#" target="_blank" title="Instagram">IG</a>
  <a id="cardFacebook" href="#" target="_blank" title="Facebook">f</a>
  <a id="cardLinkedin" href="#" target="_blank" title="LinkedIn">in</a>
  <a id="cardTiktok" href="#" target="_blank" title="TikTok">♪</a>
</div>

    <div class="brand">
      Creado con QRcrea
    </div>
  </div>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");

  async function cargarTarjeta() {
    if (!slug) return;

    const response = await fetch(
      `https://srottoudvavudcujvzeb.supabase.co/functions/v1/resolve-qr?slug=${encodeURIComponent(slug)}`
    );

    if (!response.ok) {
      console.error("No se pudo cargar la tarjeta.");
      return;
    }

    const data = await response.json();
    if (data.photo_url) {
  const photo = document.getElementById("cardPhoto");
  photo.src = data.photo_url;
  photo.style.display = "block";
}
if (data.background_url) {
  const card = document.querySelector(".vcard");

  card.style.backgroundImage = `url("${data.background_url}")`;
  card.style.backgroundSize = "cover";
  card.style.backgroundPosition = "center";
  card.style.backgroundRepeat = "no-repeat";
}
    if (data.color) {
  document.querySelectorAll(".vcard a").forEach(button => {
    button.style.background = data.color;
  });
}

    document.getElementById("cardName").textContent =
      data.name || "";

    document.getElementById("cardCompany").textContent =
      data.company || "";
      const description = document.getElementById("cardDescription");

if (data.description) {
  description.textContent = data.description;
  description.style.display = "block";
} else {
  description.style.display = "none";
}

    const phone = document.getElementById("cardPhone");
    phone.textContent = "📞 " + (data.phone || "");
    phone.href = `tel:${data.phone || ""}`;
    const whatsapp = document.getElementById("cardWhatsapp");

if (data.whatsapp) {
  const numeroWhatsapp = data.whatsapp.replace(/\D/g, "");

  whatsapp.textContent = "💬 WhatsApp";
  whatsapp.href = `https://wa.me/${numeroWhatsapp}`;
  whatsapp.style.display = "block";
} else {
  whatsapp.style.display = "none";
}

    const email = document.getElementById("cardEmail");
    email.textContent = "✉️ " + (data.email || "");
    email.href = `mailto:${data.email || ""}`;

    const website = document.getElementById("cardWebsite");
    website.textContent = "🌐 " + (data.website || "");
    website.href = data.website || "#";

    const instagram = document.getElementById("cardInstagram");
if (data.instagram) {
  instagram.href = data.instagram;
  instagram.style.display = "block";
} else {
  instagram.style.display = "none";
}

const facebook = document.getElementById("cardFacebook");
if (data.facebook) {
  facebook.href = data.facebook;
  facebook.style.display = "block";
} else {
  facebook.style.display = "none";
}
const tiktok = document.getElementById("cardTiktok");
if (data.tiktok) {
  tiktok.href = data.tiktok;
  tiktok.style.display = "block";
} else {
  tiktok.style.display = "none";
}

const linkedin = document.getElementById("cardLinkedin");
if (data.linkedin) {
  linkedin.href = data.linkedin;
  linkedin.style.display = "block";
} else {
  linkedin.style.display = "none";
}
  }

  cargarTarjeta();
</script>

</body>
</html>
